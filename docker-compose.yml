version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: entreskillhub
    ports:
      - "5432:5432"
    volumes:
      - entreskillhub_pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/entreskillhub
      JWT_SECRET: change_this_in_production
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"

volumes:
  entreskillhub_pgdata:
